# dig-tips — the DIG Network canonical tipping expert crate.
#
# A pure, key-free, network-free SpendBundle-builder library for TIPPING on Chia. dig-tips
# constructs the exact CoinSpends to tip a CAT (including $DIG) to a recipient address, and carries
# the honest, default-on AUTO-TIP to the DIG treasury (dig_ecosystem#377) as pure, capped,
# declinable policy logic. It NEVER holds a secret key, NEVER signs, and NEVER touches the network.
# The consumer signs the reported messages, assembles the SpendBundle, and broadcasts. Tipping
# implements the $DIG North Star (CLAUDE.md §6.0): move $DIG at every opportunity while keeping
# consumption frictionless. See SPEC.md for the normative contract.
#
# This is the genesis scaffold (v0.0.0, unpublished). The v0.1.0 foundation — the tip spend builder,
# the AutoTipPolicy config, the pure cap/frequency decision logic, the tip event types, and the
# signing boundary — lands via the gated PR that bumps this to 0.1.0 (DIG-Network/dig_ecosystem#1231).
[package]
name = "dig-tips"
version = "0.3.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0 OR MIT"
description = "The DIG Network canonical tipping expert crate: a pure, key-free, network-free SpendBundle-builder for tipping a CAT (incl. $DIG) to an address, plus the honest default-on auto-tip to the DIG treasury. Never holds a key, never signs, never broadcasts."
repository = "https://github.com/DIG-Network/dig-tips"
readme = "README.md"
keywords = ["dig", "chia", "cat", "tip", "payment"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
# The CAT primitive (send/melt/selection builders) — $DIG is a CAT; a tip IS a CAT send.
dig-cat = "0.3"
# The canonical DIG treasury constant (DIG_TREASURY_INNER_PUZZLE_HASH / TREASURY_ADDRESS) — the
# default auto-tip recipient. Reused from the foundation, never hand-copied.
dig-constants = "0.11"
# The chia-wallet-sdk umbrella is the byte-source-of-truth for the CAT puzzle/layer/spend + the pure
# signing calculator, pinned to the 0.36 family the whole DIG on-chain line rides (chia-protocol 0.36.1).
chia-wallet-sdk = "0.36"
# Direct type deps, pinned to EXACTLY the versions chia-wallet-sdk 0.36 resolves to (a mismatch is a
# hard cargo error, given chia-wallet-sdk 0.36). chia-protocol carries wire types (`Coin`, `CoinSpend`, `Bytes32`).
chia-protocol = "0.36.1"
chia-puzzle-types = "0.36.1"
clvm-traits = "0.36.1"
clvmr = "0.16.2"
# The crate error taxonomy (SPEC §6). thiserror 2 matches the sibling DIG crates.
thiserror = "2"

[dev-dependencies]
chia-sdk-test = "0.36"
hex = "0.4"
anyhow = "1"
